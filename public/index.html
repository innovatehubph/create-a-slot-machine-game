<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine - Casino Night</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "framer-motion": "https://esm.sh/framer-motion@11?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom",
        "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.3"
      }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap');
        
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .casino-gradient {
            background: radial-gradient(circle at center, #1a1a2e 0%, #050505 100%);
        }

        .glow-red { text-shadow: 0 0 10px rgba(239, 68, 68, 0.5), 0 0 20px rgba(239, 68, 68, 0.3); }
        .glow-yellow { text-shadow: 0 0 10px rgba(245, 158, 11, 0.5), 0 0 20px rgba(245, 158, 11, 0.3); }
        .glow-blue { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5), 0 0 20px rgba(59, 130, 246, 0.3); }
        
        .reel-container {
            mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
        }

        .neon-border {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1), inset 0 0 15px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .jackpot-anim {
            animation: jackpot-pulse 1.5s infinite;
        }

        @keyframes jackpot-pulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.3); }
        }
    </style>
</head>
<body class="casino-gradient min-h-screen flex items-center justify-center p-4">
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect, useCallback, useRef } from "react";
        import { createRoot } from "react-dom/client";
        import { motion, AnimatePresence } from "framer-motion";
        import { 
            Cherry, 
            Zap, 
            Diamond, 
            Bell, 
            Star, 
            Coins, 
            RefreshCw, 
            Trophy, 
            Settings, 
            Info,
            ChevronUp,
            ChevronDown,
            Volume2,
            VolumeX
        } from "lucide-react";
        import confetti from "canvas-confetti";

        const SYMBOLS = [
            { id: 'cherry', icon: Cherry, color: 'text-red-500', value: 2, weight: 10 },
            { id: 'lemon', icon: Zap, color: 'text-yellow-400', value: 5, weight: 8 },
            { id: 'grape', icon: Info, color: 'text-purple-500', value: 10, weight: 6 },
            { id: 'bell', icon: Bell, color: 'text-yellow-600', value: 20, weight: 4 },
            { id: 'diamond', icon: Diamond, color: 'text-blue-400', value: 50, weight: 2 },
            { id: 'seven', icon: Star, color: 'text-red-600', value: 100, weight: 1 },
        ];

        // Create a weighted pool for random selection
        const SYMBOL_POOL = SYMBOLS.flatMap(s => Array(s.weight).fill(s));

        const getRandomSymbol = () => SYMBOL_POOL[Math.floor(Math.random() * SYMBOL_POOL.length)];

        const Reel = ({ isSpinning, targetSymbol, delay }) => {
            const [displaySymbols, setDisplaySymbols] = useState([getRandomSymbol(), getRandomSymbol(), getRandomSymbol()]);
            const [localSpinning, setLocalSpinning] = useState(false);

            useEffect(() => {
                let timeout;
                if (isSpinning) {
                    setLocalSpinning(true);
                } else {
                    // Stagger the stop based on delay
                    timeout = setTimeout(() => {
                        setLocalSpinning(false);
                    }, delay * 500);
                }
                return () => clearTimeout(timeout);
            }, [isSpinning, delay]);
            
            useEffect(() => {
                if (localSpinning) {
                    const interval = setInterval(() => {
                        setDisplaySymbols(prev => [getRandomSymbol(), ...prev.slice(0, 2)]);
                    }, 100);
                    
                    return () => clearInterval(interval);
                } else if (targetSymbol) {
                    // When stopping, ensure the target symbol is in the middle
                    setDisplaySymbols(prev => [getRandomSymbol(), targetSymbol, getRandomSymbol()]);
                }
            }, [localSpinning, targetSymbol]);

            return (
                <div className="relative w-24 h-48 sm:w-32 sm:h-64 bg-gray-900/50 rounded-xl overflow-hidden neon-border flex flex-col items-center justify-center">
                    <div className="reel-container w-full h-full flex flex-col items-center justify-center gap-4 py-8">
                        <AnimatePresence mode="popLayout">
                            {displaySymbols.map((symbol, idx) => (
                                <motion.div
                                    key={`${symbol.id}-${idx}-${isSpinning}`}
                                    initial={isSpinning ? { y: -50, opacity: 0 } : { y: 0, opacity: 1 }}
                                    animate={{ y: 0, opacity: 1 }}
                                    exit={isSpinning ? { y: 50, opacity: 0 } : { opacity: 1 }}
                                    transition={{ 
                                        type: "spring", 
                                        stiffness: 300, 
                                        damping: 30,
                                        delay: isSpinning ? 0 : delay * 0.1
                                    }}
                                    className={`flex items-center justify-center ${idx === 1 ? 'scale-110 sm:scale-125 z-10' : 'opacity-30 blur-[1px]'}`}
                                >
                                    <symbol.icon 
                                        size={idx === 1 ? 48 : 32} 
                                        className={`${symbol.color} ${idx === 1 ? 'drop-shadow-lg' : ''}`} 
                                    />
                                </motion.div>
                            ))}
                        </AnimatePresence>
                    </div>
                    {/* Highlight middle row */}
                    <div className="absolute inset-0 border-y-2 border-white/10 pointer-events-none" />
                </div>
            );
        };

        const App = () => {
            const [balance, setBalance] = useState(1000);
            const [bet, setBet] = useState(10);
            const [isSpinning, setIsSpinning] = useState(false);
            const [reels, setReels] = useState([null, null, null]);
            const [lastWin, setLastWin] = useState(0);
            const [message, setMessage] = useState("Ready to spin?");
            const [soundEnabled, setSoundEnabled] = useState(true);

            const spin = () => {
                if (balance < bet || isSpinning) return;

                setBalance(prev => prev - bet);
                setIsSpinning(true);
                setLastWin(0);
                setReels([null, null, null]); // Reset results
                setMessage("Spinning...");

                // Determine results immediately
                const results = [getRandomSymbol(), getRandomSymbol(), getRandomSymbol()];
                
                // Spin for a while then stop sequentially
                setTimeout(() => {
                    setReels(results);
                    setIsSpinning(false);
                    
                    // Wait for the last reel to stop (2 * 500ms delay + some buffer)
                    setTimeout(() => {
                        checkWin(results);
                    }, 1500);
                }, 1000);
            };

            const checkWin = (results) => {
                const [r1, r2, r3] = results;
                
                if (r1.id === r2.id && r2.id === r3.id) {
                    const winAmount = bet * r1.value;
                    setBalance(prev => prev + winAmount);
                    setLastWin(winAmount);
                    setMessage(`JACKPOT! +$${winAmount}`);
                    
                    confetti({
                        particleCount: 150,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#ef4444', '#f59e0b', '#3b82f6', '#ffffff']
                    });
                } else if (r1.id === r2.id || r2.id === r3.id || r1.id === r3.id) {
                    // Small win for 2 matching? (Optional)
                    const winAmount = bet * 2;
                    setBalance(prev => prev + winAmount);
                    setLastWin(winAmount);
                    setMessage(`Nice! Two of a kind +$${winAmount}`);
                } else {
                    setMessage("Try again!");
                }
            };

            const adjustBet = (amount) => {
                if (isSpinning) return;
                setBet(prev => Math.max(10, Math.min(balance, prev + amount)));
            };

            return (
                <div className="w-full max-w-2xl mx-auto flex flex-col gap-8">
                    {/* Header */}
                    <div className="flex items-center justify-between px-4">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-red-600 rounded-lg shadow-lg shadow-red-600/20">
                                <Trophy className="text-white" size={24} />
                            </div>
                            <h1 className="text-2xl font-black tracking-tighter uppercase font-['Space_Grotesk'] italic">
                                Neon<span className="text-red-500">Slots</span>
                            </h1>
                        </div>
                        <div className="flex items-center gap-4">
                            <button 
                                onClick={() => setSoundEnabled(!soundEnabled)}
                                className="p-2 rounded-full hover:bg-white/5 transition-colors"
                            >
                                {soundEnabled ? <Volume2 size={20} className="text-gray-400" /> : <VolumeX size={20} className="text-gray-600" />}
                            </button>
                            <div className="flex flex-col items-end">
                                <span className="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Balance</span>
                                <span className="text-xl font-bold text-white tabular-nums">${balance.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>

                    {/* Slot Machine Body */}
                    <div className="bg-gray-800/40 backdrop-blur-xl rounded-[2.5rem] p-6 sm:p-10 border border-white/5 shadow-2xl relative overflow-hidden">
                        {/* Decorative background elements */}
                        <div className="absolute top-0 left-1/4 w-32 h-32 bg-red-500/10 blur-[80px] rounded-full" />
                        <div className="absolute bottom-0 right-1/4 w-32 h-32 bg-blue-500/10 blur-[80px] rounded-full" />

                        <div className="relative flex flex-col gap-8">
                            {/* Message Display */}
                            <div className="h-12 flex items-center justify-center">
                                <motion.p 
                                    key={message}
                                    initial={{ y: 10, opacity: 0 }}
                                    animate={{ y: 0, opacity: 1 }}
                                    className={`text-lg font-bold tracking-wide uppercase ${lastWin > 0 ? 'text-yellow-400 glow-yellow' : 'text-gray-400'}`}
                                >
                                    {message}
                                </motion.p>
                            </div>

                            {/* Reels Section */}
                            <div className="flex justify-center gap-3 sm:gap-6">
                                <Reel isSpinning={isSpinning} targetSymbol={reels[0]} delay={0} />
                                <Reel isSpinning={isSpinning} targetSymbol={reels[1]} delay={1} />
                                <Reel isSpinning={isSpinning} targetSymbol={reels[2]} delay={2} />
                            </div>

                            {/* Controls */}
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 items-center">
                                {/* Bet Control */}
                                <div className="flex flex-col gap-2">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Amount to Bet</span>
                                        <button 
                                            onClick={() => setBet(balance)}
                                            className="text-[10px] text-red-500 font-bold hover:underline"
                                            disabled={isSpinning}
                                        >
                                            MAX
                                        </button>
                                    </div>
                                    <div className="flex items-center bg-black/40 rounded-2xl p-1 border border-white/5">
                                        <button 
                                            disabled={isSpinning}
                                            onClick={() => adjustBet(-10)}
                                            className="p-2 hover:bg-white/5 rounded-xl transition-colors disabled:opacity-20"
                                        >
                                            <ChevronDown size={20} className="text-gray-400" />
                                        </button>
                                        <span className="flex-1 text-center font-bold text-lg tabular-nums">${bet}</span>
                                        <button 
                                            disabled={isSpinning}
                                            onClick={() => adjustBet(10)}
                                            className="p-2 hover:bg-white/5 rounded-xl transition-colors disabled:opacity-20"
                                        >
                                            <ChevronUp size={20} className="text-gray-400" />
                                        </button>
                                    </div>
                                </div>

                                {/* Spin Button */}
                                <div className="flex justify-center">
                                    <motion.button
                                        whileHover={{ scale: 1.05 }}
                                        whileTap={{ scale: 0.95 }}
                                        disabled={isSpinning || balance < bet}
                                        onClick={spin}
                                        className={`
                                            group relative w-32 h-32 rounded-full flex items-center justify-center transition-all duration-300
                                            ${isSpinning ? 'bg-gray-700 cursor-not-allowed' : 'bg-red-600 hover:bg-red-500 shadow-[0_0_30px_rgba(239,68,68,0.3)]'}
                                        `}
                                    >
                                        {isSpinning ? (
                                            <RefreshCw className="text-white/40 animate-spin" size={40} />
                                        ) : (
                                            <span className="text-xl font-black text-white uppercase tracking-tighter italic">Spin</span>
                                        )}
                                        {/* Glow effect */}
                                        {!isSpinning && (
                                            <div className="absolute inset-0 rounded-full bg-red-500 blur-xl opacity-0 group-hover:opacity-20 transition-opacity" />
                                        )}
                                    </motion.button>
                                </div>

                                {/* Stats/Last Win */}
                                <div className="flex flex-col gap-2 items-center sm:items-end">
                                    <span className="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Last Win</span>
                                    <div className="h-11 flex items-center">
                                        <span className={`text-2xl font-black tabular-nums ${lastWin > 0 ? 'text-yellow-400' : 'text-gray-700'}`}>
                                            +${lastWin}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Legend / Payouts */}
                    <div className="grid grid-cols-3 sm:grid-cols-6 gap-4 px-4 opacity-50 hover:opacity-100 transition-opacity">
                        {SYMBOLS.map(symbol => (
                            <div key={symbol.id} className="flex flex-col items-center gap-1">
                                <symbol.icon size={16} className={symbol.color} />
                                <span className="text-[10px] font-bold">x{symbol.value}</span>
                            </div>
                        ))}
                    </div>

                    {/* Footer */}
                    <p className="text-center text-[10px] text-gray-600 font-medium uppercase tracking-widest">
                        Demo Purpose Only • No Real Money Involved
                    </p>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
